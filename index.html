<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hora Marcada">
</head>
<body>
<title>Hora Marcada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Agende seu horário online em menos de 1 minuto.">
<meta name="theme-color" content="#F6F7F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: cliente numa coluna central de passos; painel com barra lateral no computador e barra de abas embaixo no celular */
:root{
  --brand:#5B5BD6;
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --ink:#15171C; --ink-2:#3B3F48; --muted:#6B7180; --line:#E6E8ED;
  --accent:var(--brand); --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in srgb, var(--brand) 9%, var(--surface));
  --accent-line:color-mix(in srgb, var(--brand) 28%, var(--line));
  --ok:#2E8B62; --ok-soft:#E8F5EE; --warn:#A8690F; --warn-soft:#FDF3E1; --bad:#C2453D; --bad-soft:#FCECEB; --info:#3D63C9; --info-soft:#EBF0FD;
  --night:#1F2340; --night-ink:#EEF0FF;
  --demo:#15171C; --demo-ink:#F6F7F9; --demo-soft:#2C2F37;
  --shadow:0 1px 2px rgb(16 24 40 / .04), 0 1px 3px rgb(16 24 40 / .06);
  --shadow-lg:0 12px 32px rgb(16 24 40 / .10);
  --font:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111215; --surface:#191B20; --surface-2:#22252B; --ink:#F1F2F5; --ink-2:#C9CCD3; --muted:#9A9FAB; --line:#2C3038;
    --accent:color-mix(in oklab, var(--brand) 62%, white); --accent-ink:#111215;
    --accent-soft:color-mix(in srgb, var(--brand) 20%, var(--surface));
    --accent-line:color-mix(in srgb, var(--brand) 40%, var(--line));
    --ok:#5CC796; --ok-soft:#15302A; --warn:#E6B05C; --warn-soft:#352914; --bad:#F08A82; --bad-soft:#3A1E1D; --info:#94AEF2; --info-soft:#1C2540;
    --night:#1B1E36; --night-ink:#EEF0FF; --demo:#08090B; --demo-ink:#F1F2F5; --demo-soft:#25282F;
    --shadow:0 1px 2px rgb(0 0 0 / .3); --shadow-lg:0 12px 32px rgb(0 0 0 / .4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111215; --surface:#191B20; --surface-2:#22252B; --ink:#F1F2F5; --ink-2:#C9CCD3; --muted:#9A9FAB; --line:#2C3038;
  --accent:color-mix(in oklab, var(--brand) 62%, white); --accent-ink:#111215;
  --accent-soft:color-mix(in srgb, var(--brand) 20%, var(--surface));
  --accent-line:color-mix(in srgb, var(--brand) 40%, var(--line));
  --ok:#5CC796; --ok-soft:#15302A; --warn:#E6B05C; --warn-soft:#352914; --bad:#F08A82; --bad-soft:#3A1E1D; --info:#94AEF2; --info-soft:#1C2540;
  --night:#1B1E36; --night-ink:#EEF0FF; --demo:#08090B; --demo-ink:#F1F2F5; --demo-soft:#25282F;
  --shadow:0 1px 2px rgb(0 0 0 / .3); --shadow-lg:0 12px 32px rgb(0 0 0 / .4); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%, transparent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- barra da demonstração ---------- */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--demo);color:var(--demo-ink);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px}
.demo-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-right:2px}
.seg{display:flex;gap:2px;background:var(--demo-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--demo-ink);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;opacity:.7;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--demo-ink);color:var(--demo);opacity:1}
.demo .link{border:0;background:transparent;color:var(--demo-ink);font-size:13px;opacity:.6;text-decoration:underline;margin-left:auto;padding:4px}

/* ---------- elementos comuns ---------- */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-pri{background:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{filter:brightness(1.05)}
.btn-sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn-sec:hover{border-color:var(--accent-line)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-soft:hover{background:var(--accent-soft)}
.btn-ghost{background:transparent;color:var(--muted);padding:9px 8px}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn-lg{padding:15px 18px;font-size:16px;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg.i{width:18px;height:18px}
.grow{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s, box-shadow .15s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.inp{resize:vertical;min-height:88px;line-height:1.45}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:14px;font-weight:500;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1.4}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;line-height:1.5;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-mute{background:var(--surface-2);color:var(--muted)}
.c-mute::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{max-width:100%}
.info .chip,.ntx .chip{white-space:normal}
.two > *{min-width:0}
input[type=date].inp,input[type=time].inp{min-width:0}
@media (max-width:480px){div.two{grid-template-columns:1fr}}
@media (max-width:520px){.brow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}.brow .bt{grid-column:1 / -1;grid-row:2}}
@media (max-width:640px){.btn-sm,.btn-ghost{min-height:40px}.lrow .linkbtn{padding:10px 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;font-size:14.5px;max-width:min(520px, calc(100% - 32px));box-shadow:var(--shadow-lg);z-index:50}
.saving{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;animation:load 1s linear infinite}
@keyframes load{from{background-position:-50% 0}to{background-position:150% 0}}
.skel{border-radius:14px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}

/* ================= PÁGINA DO CLIENTE ================= */
.cpage{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 64px}
.cwrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 14px}
.mono{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:22px;letter-spacing:-.02em;flex:none}
.chead h1{font-size:clamp(24px,6vw,30px);font-weight:700;margin:0;line-height:1.1}
.chead p{margin:0;color:var(--muted);font-size:15px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.step.done{padding:12px 14px 12px 16px;gap:0;box-shadow:none;background:color-mix(in srgb,var(--surface) 70%, var(--bg))}
.step-h{display:flex;align-items:center;gap:12px}
.n{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.done .n{background:var(--accent);color:var(--accent-ink)}
.n svg.i{width:15px;height:15px;stroke-width:2.6}
.step h2{font-size:18.5px;font-weight:650;margin:0;line-height:1.25;flex:1;min-width:0}
.done h2{font-size:15px;font-weight:600}
.done h2 small{display:block;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.svcs{display:grid;gap:10px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 16px;transition:border-color .15s, background .15s}
.svc:hover{border-color:var(--accent);background:var(--accent-soft)}
.svc b{display:block;font-weight:600;font-size:16px}
.svc span{color:var(--muted);font-size:14px}
.svc .price{font-weight:650;color:var(--ink);white-space:nowrap}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav strong{font-size:15px;font-weight:600;text-align:center}
.wnav strong span{display:block;color:var(--muted);font-weight:500;font-size:13px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.round:disabled{opacity:.35;cursor:not-allowed}
.round svg.i{width:18px;height:18px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;transition:border-color .15s, background .15s}
.day .wd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dn{font-weight:700;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}
.day .st{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .s2{display:none}
.days-note{display:none}
@media (max-width:480px){.day .s1{display:none}.day .s2{display:inline}.days-note{display:block}}
.day:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.day:disabled{cursor:not-allowed;background:var(--surface-2);border-color:transparent}
.day:disabled .dn,.day:disabled .st{color:var(--muted);font-weight:500}
.day.sel{background:var(--accent);border-color:var(--accent)}
.day.sel .wd,.day.sel .dn,.day.sel .st{color:var(--accent-ink)}
.day.off{background:var(--surface-2);border-color:transparent}
.day.off .st{color:var(--muted);font-weight:500}
.per{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;transition:border-color .15s, background .15s}
.pbtn svg.i{width:28px;height:28px;color:var(--accent);margin-bottom:6px}
.pbtn b{font-size:20px;font-weight:700;line-height:1.1}
.pbtn span{font-size:14px;color:var(--muted)}
.pbtn em{font-style:normal;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;margin-top:6px}
.pbtn:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.pbtn:disabled{cursor:not-allowed;background:var(--surface-2);border-color:transparent}
.pbtn:disabled svg.i,.pbtn:disabled em{color:var(--muted)}
.pbtn:disabled em{background:transparent;padding:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 4px;font-weight:650;font-size:16.5px;font-variant-numeric:tabular-nums;transition:border-color .15s, background .15s}
.slot:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pgroup{display:flex;flex-direction:column;gap:8px}
.opt{font-weight:500;color:var(--muted)}
.slot small{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-top:1px}
.slot.exact{border-color:var(--accent);background:var(--accent-soft)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.addr{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;max-width:100%;text-align:left}
.addr span{overflow-wrap:anywhere}
.addr svg.i{width:16px;height:16px}
.addr:hover{color:var(--accent)}
.tlink{color:var(--accent);font-weight:600;overflow-wrap:anywhere;text-align:right;text-decoration:none}
.pix{width:100%;text-align:left;background:var(--warn-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pix b{display:flex;align-items:center;gap:8px;color:var(--ink)}
.pix > span{font-size:14px;color:var(--ink-2)}
.pix .btn{align-self:flex-start}
.linkbtn svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.check a,.cfoot a{color:var(--accent)}
.priv h2{margin:0}
.priv h3{font-size:15.5px;margin:8px 0 -8px}
.priv p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.6}
.priv .btn{align-self:flex-start}
.manage{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.manage > span{font-size:14px;color:var(--muted)}
.manage .btn{align-self:flex-start}
.recap{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink-2)}
.recap b{color:var(--ink)}
.done-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 22px;display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center;box-shadow:var(--shadow)}
.okmark{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.okmark svg.i{width:34px;height:34px;stroke-width:2.4}
.done-card h2{font-size:25px;line-height:1.15;margin:0}
.ticket{width:100%;background:var(--surface-2);border-radius:14px;padding:14px 16px;text-align:left;display:grid;gap:8px}
.ticket div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.ticket span{color:var(--muted)}
.ticket b{text-align:right;font-weight:600}
.stack{display:grid;gap:10px;width:100%}
.cfoot{text-align:center;color:var(--muted);font-size:12.5px;padding-top:10px}
.cfoot a{color:inherit}

/* ================= LOGIN ================= */
.login{min-height:calc(100vh - 48px);display:grid;grid-template-columns:1fr;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px}
.lcard{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .logo svg.i{width:19px;height:19px;stroke-width:2.2}
.lcard h1{font-size:28px;margin:12px 0 0;line-height:1.15}
.lcard > p{margin:0;color:var(--muted)}
.lform{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.pw{position:relative}
.pw .inp{padding-right:48px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.demo-acc{display:grid;gap:8px}
.demo-acc button{display:flex;align-items:center;gap:12px;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:14px;padding:11px 14px}
.demo-acc button:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-acc i{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;color:#fff}
.demo-acc span{font-size:13px;color:var(--muted);display:block}
.side-art{display:none}
@media (min-width:960px){
  .login{grid-template-columns:1.05fr 1fr;padding:0;min-height:calc(100vh - 48px)}
  .side-art{display:flex;flex-direction:column;justify-content:space-between;padding:48px;background:var(--accent-soft);border-right:1px solid var(--line)}
  .side-art h2{font-size:34px;line-height:1.12;margin:0 0 18px;max-width:14ch}
  .side-art ul{list-style:none;padding:0;margin:0;display:grid;gap:14px;max-width:40ch}
  .side-art li{display:flex;gap:12px;color:var(--ink-2)}
  .side-art li svg.i{color:var(--accent);margin-top:2px}
  .side-art .mock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-lg);max-width:380px;display:grid;gap:10px}
  .login .lcard{padding:48px 32px}
}
.mock .mrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.mock .mrow b{font-variant-numeric:tabular-nums;width:44px}

function pascoa(y){
  const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);

}

  if (encaixe) return cabe(p, data, toMin(hora), dur, ignorar, true) ? null : {ok:false, erro:"Esse encaixe bate com outro atendimento ou bloqueio."};
  const l = livresDemo(p, data, 1, dur, {dona:true, ignorar})[0];

        (longe && C.opcoes.length ? `<p class="hint">Nesse dia não temos nada tão perto das ${hCurta(C.pref)}. Esses são os mais próximos, ou escolha outro dia.</p>` : "") +
        `<div class="row-btns"><button class="btn btn-soft btn-sm" type="button" onclick="cVoltar(3)">Escolher outra hora</button><button class="btn btn-ghost btn-sm" type="button" onclick="cVoltar(2)">Ver outro dia</button>${C.rem ? "" : `<button class="btn btn-ghost btn-sm" type="button" onclick="abrirEspera(C.dia.data)">${ic("clock")} Lista de espera</button>`}</div>`);

    const pr = periodos(c), exd = expediente(c, C.dia.data);
    if (C.periodo) h += passoOk(3, "Período", C.periodo==="manha" ? "Manhã" : "Tarde");
    else { const m = C.dia.manha.length, t = C.dia.tarde.length, q = n => n===0 ? "Sem horários" : n===1 ? "1 horário" : n+" horários";
      h += passo(3, "Prefere de manhã ou à tarde?", `<div class="per">
        <button class="pbtn" type="button" ${m?"":"disabled"} onclick="cPeriodo('manha')">${ic("sun")}<b>Manhã</b><span>${hCurta(exd.abre)} às ${hCurta(pr.fimManha)}</span><em>${q(m)}</em></button>
        <button class="pbtn" type="button" ${t?"":"disabled"} onclick="cPeriodo('tarde')">${ic("sunset")}<b>Tarde</b><span>${hCurta(pr.iniTarde)} às ${hCurta(exd.fecha)}</span><em>${q(t)}</em></button></div>`); }
  }
  if (C.periodo){
    if (C.hora) h += passoOk(4, "Horário", `<span class="tnum">${C.hora}</span>`);
    else h += passo(4, "Escolha o horário", `<div class="slots">${C.dia[C.periodo].map(x => `<button class="slot" type="button" onclick="cHora('${x}')">${x}</button>`).join("")}</div><p class="hint">Mostramos só os horários livres para ${esc(C.servico.nome.toLowerCase())} (${C.servico.duracao} min).</p>`);
  }
  if (C.hora && C.rem){
    h += passo(5, "Confirme a mudança", `<div class="ticket"><div><span>Antes</span><b style="text-decoration:line-through;color:var(--muted)">${cap(semFeira(dataLonga(C.rem.antes.data)))}, ${C.rem.antes.hora}</b></div><div><span>Novo horário</span><b>${cap(semFeira(dataLonga(C.dia.data)))}, ${C.hora}</b></div></div>
      ${C.formErro ? `<p class="err" role="alert">${esc(C.formErro)}</p>` : ""}
      <button class="btn btn-pri btn-lg" type="button" onclick="cConfirmarRem()" ${C.enviando ? "disabled" : ""}>${C.enviando ? "Salvando…" : "Confirmar novo horário"}</button>`);
  } else if (C.hora){
    h += passo(5, "Pra quem é o horário?", `<div class="recap">${esc(C.servico.nome)}<br><b>${cap(dataLonga(C.dia.data))}, às ${C.hora}</b></div>
      <div class="field"><label for="cNome">Nome e sobrenome</label><input class="inp" id="cNome" autocomplete="name" value="${esc(C.nome)}" oninput="C.nome=this.value" placeholder="Ex.: Ana Paula Souza"></div>
      <div class="field"><label for="cTel">WhatsApp</label><input class="inp" id="cTel" type="tel" inputmode="numeric" autocomplete="tel-national" value="${esc(C.tel)}" placeholder="(16) 99999-9999" oninput="this.value=mascara(this.value);C.tel=this.value"><p class="hint">Se precisar remarcar, a gente avisa por aqui.</p></div>
      <div class="field"><label for="cEmail">E-mail <span class="opt">(opcional)</span></label><input class="inp" id="cEmail" type="email" inputmode="email" autocomplete="email" value="${esc(C.email)}" placeholder="voce@email.com" oninput="C.email=this.value"><p class="hint">Pra receber a confirmação do horário.</p></div>
      <label class="check"><input id="cOk" type="checkbox" ${C.ok?"checked":""} onchange="C.ok=this.checked"><span>Autorizo o uso do meu nome, WhatsApp e e-mail só para este agendamento e avisos sobre ele. <a href="#privacidade">Política de privacidade</a></span></label>
      ${C.formErro ? `<p class="err" role="alert">${esc(C.formErro)}</p>` : ""}
      <button class="btn btn-pri btn-lg" type="button" onclick="cConfirmar()" ${C.enviando?"disabled":""}>${C.enviando ? "Confirmando…" : "Confirmar agendamento"}</button>`);
  }
  app.innerHTML = `<main class="cpage"><div class="cwrap">${h}${blocoEspera()}${rodape()}</div></main>`;

function porDia(lista, onde){

function periodoRapido(k){

async function carregarPeriodo(){
  const R = PA.rel, ok = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
  R.lista = null; R.erro = "";
  if (!ok(R.de) || !ok(R.ate)){ R.erro = "Escolha as duas datas."; R.carregando = false; render(); return; }
  if (R.de > R.ate){ R.erro = "A data inicial precisa ser antes da final."; R.carregando = false; render(); return; }
  if (parse(R.ate) - parse(R.de) > 400*864e5){ R.erro = "Escolha um período de até 13 meses."; R.carregando = false; render(); return; }
  const n = ++R.n; R.carregando = true; render();
  const r = await api("relatorio", {token:PA.token, negocio:PA.negocio, de:R.de, ate:R.ate});
  if (n !== R.n) return;
  R.carregando = false;
  if (!r.ok){ if (r.sessao){ await sair(true); toast(r.erro); return; } R.erro = r.erro || "Não deu certo. Tente de novo."; render(); return; }

}
function agruparPeriodo(){

  const sem = todas.filter(r => r.status==="aprovado" && !r.presenca && terminou(r));
  const cont = R.semMarca ? veio.concat(sem) : veio, g = {};

    const k = kc(chaveCli(r.telefone, r.cliente)), x = g[k] = g[k] || {nome:r.cliente, tel:r.telefone, n:0, tot:0, pago:0, aRec:0, sv:{}, datas:[], formas:{}};
    x.n++; x.tot += r.preco; if (r.pago){ x.pago += r.preco; x.formas[r.forma || "Outro"] = 1; } else x.aRec += r.preco; x.sv[r.servico] = (x.sv[r.servico]||0)+1; x.datas.push(r.data);
  });
  const grupos = Object.values(g).map(x => ({...x, datas:x.datas.sort()})).sort((a,b) => b.tot-a.tot || b.n-a.n || a.nome.localeCompare(b.nome, "pt-BR"));
  const fm = {}; cont.filter(r => r.pago).forEach(r => { const k = r.forma || "Outro"; fm[k] = (fm[k]||0) + r.preco; });
  return {cont, grupos, sem, faltas: todas.filter(r => r.presenca==="faltou").length, total: cont.reduce((s,r) => s+r.preco, 0),
    recebido: cont.filter(r => r.pago).reduce((s,r) => s+r.preco, 0), aReceber: cont.filter(r => !r.pago).reduce((s,r) => s+r.preco, 0), formas: fm};
}

function seriePdf(cont, de, ate){

    <div class="field"><label for="ajEnd">Endereço</label><input class="inp" id="ajEnd" value="${esc(a.endereco || "")}" placeholder="Rua, número, sala, bairro, cidade" oninput="PA.aj.endereco=this.value;atualizarSavebar()"><p class="hint">Aparece na página, na confirmação e no lembrete, com o botão "Como chegar". Atendimentos online usam o link da sala.</p></div>
    <div class="swrow"><div><b>Modo discreto</b><span>Lembretes e avisos dizem só "sua sessão", sem citar o tipo de atendimento.</span></div><label class="switch"><input type="checkbox" ${a.discreto ? "checked" : ""} onchange="PA.aj.discreto=this.checked;render()" aria-label="Modo discreto"><span></span></label></div></section>`;
  h += `<section class="panel"><h3>Horário de atendimento</h3><div class="field"><span class="lbl">Dias da semana</span><div class="daypick">${[1,2,3,4,5,6,0].map(d => `<button type="button" aria-pressed="${a.dias.includes(d)}" onclick="PA.aj.dias=PA.aj.dias.includes(${d})?PA.aj.dias.filter(x=>x!==${d}):[...PA.aj.dias,${d}].sort();render()">${DIAS[d]}</button>`).join("")}</div></div>
    <div class="grid3"><div class="field"><label for="ajAbre">Abre às</label>${sel("ajAbre", a.abre, "PA.aj.abre", horas)}</div><div class="field"><label for="ajFecha">Fecha às</label>${sel("ajFecha", a.fecha, "PA.aj.fecha", horas)}</div>
      <div class="field"><label for="ajInt">Folga entre clientes</label>${sel("ajInt", a.intervalo+" min", "PA.aj.intervalo", ["0 min","5 min","10 min","15 min","20 min","30 min"]).replace('PA.aj.intervalo=this.value','PA.aj.intervalo=parseInt(this.value)')}</div></div>
    <div class="field"><label for="ajPasso">Horários começam a cada</label>${sel("ajPasso", (a.passo||30)+" min", "PA.aj.passo", ["10 min","15 min","20 min","30 min","60 min"]).replace('PA.aj.passo=this.value','PA.aj.passo=parseInt(this.value)')}<p class="hint">Com 30 min, dá para marcar 13:00 ou 13:30. Com 60 min, só hora cheia. Para um horário fora da grade, use "Encaixe" ao marcar.</p></div>
    ${blocoHorarioDia(a)}
    <div class="swrow"><div><b>Intervalo de almoço</b><span>Some da página de agendamento.</span></div><label class="switch"><input type="checkbox" ${a.almoco.ativo ? "checked" : ""} onchange="PA.aj.almoco.ativo=this.checked;render()" aria-label="Intervalo de almoço"><span></span></label></div>
    ${a.almoco.ativo ? `<div class="two"><div class="field"><label for="ajAlI">Das</label>${sel("ajAlI", a.almoco.ini, "PA.aj.almoco.ini", horas)}</div><div class="field"><label for="ajAlF">Até</label>${sel("ajAlF", a.almoco.fim, "PA.aj.almoco.fim", horas)}</div></div>` : ""}
    <div class="swrow"><div><b>Agenda reservada</b><span>O cliente escolhe a hora que prefere e vê só os horários livres mais próximos. Ninguém sabe se sua agenda está cheia ou vazia.</span></div><label class="switch"><input type="checkbox" ${a.reservada ? "checked" : ""} onchange="PA.aj.reservada=this.checked;render()" aria-label="Agenda reservada"><span></span></label></div>
    ${a.reservada ? `<div class="field"><label for="ajSug">Quantos horários mostrar</label>${sel("ajSug", (a.sugestoes||4)+" opções", "PA.aj.sugestoes", ["2 opções","3 opções","4 opções","5 opções","6 opções"]).replace('PA.aj.sugestoes=this.value','PA.aj.sugestoes=parseInt(this.value)')}</div>` : ""}
    <div class="field"><label for="ajAnt">Antecedência mínima para agendar</label>${sel("ajAnt", a.antecedenciaHoras+"h", "PA.aj.antecedenciaHoras", ["1h","2h","3h","6h","12h","24h","48h"]).replace('PA.aj.antecedenciaHoras=this.value','PA.aj.antecedenciaHoras=parseInt(this.value)')}<p class="hint">Evita agendamento em cima da hora.</p></div>
    <div class="swrow"><div><b>Fechar nos feriados nacionais</b><span>A página fecha sozinha em Natal, Finados, Consciência Negra e os outros feriados nacionais. Feriados da cidade, use Bloquear horário.</span></div><label class="switch"><input type="checkbox" ${a.fecharFeriados ? "checked" : ""} onchange="PA.aj.fecharFeriados=this.checked;render()" aria-label="Fechar nos feriados nacionais"><span></span></label></div>
    ${a.fecharFeriados ? `<label class="check"><input type="checkbox" ${a.fecharFacultativos ? "checked" : ""} onchange="PA.aj.fecharFacultativos=this.checked;render()"><span>Fechar também no Carnaval e em Corpus Christi</span></label>` : ""}</section>`;
  h += `<section class="panel"><h3>Atendimento e avisos</h3>
    <div class="field"><label for="ajCanc">Cliente pode remarcar ou cancelar sozinho até</label>${sel("ajCanc", a.cancelarAteHoras+"h antes", "PA.aj.cancelarAteHoras", ["2h antes","6h antes","12h antes","24h antes","48h antes"]).replace('PA.aj.cancelarAteHoras=this.value','PA.aj.cancelarAteHoras=parseInt(this.value)')}<p class="hint">Depois disso, a página pede pra ele falar com você no WhatsApp.</p></div>
    <div class="swrow"><div><b>Lembrete automático por e-mail</b><span>Todo dia às 18h, quem informou e-mail recebe o lembrete do dia seguinte.</span></div><label class="switch"><input type="checkbox" ${a.lembreteEmail ? "checked" : ""} onchange="PA.aj.lembreteEmail=this.checked;render()" aria-label="Lembrete automático por e-mail"><span></span></label></div>

    ${a.atendeOnline !== false ? `<div class="field"><label for="ajOnline">Link da sala de videochamada</label><input class="inp" id="ajOnline" value="${esc(a.linkOnline||"")}" placeholder="https://meet.google.com/..." oninput="PA.aj.linkOnline=this.value.trim();atualizarSavebar()"><p class="hint">Vai na confirmação e no lembrete dos serviços marcados como "por videochamada". Deixe vazio se preferir mandar o link pelo WhatsApp.</p></div>` : ""}
    <div class="field"><label for="ajAval">Link de avaliação do Google</label><input class="inp" id="ajAval" value="${esc(a.linkAvaliacao||"")}" placeholder="https://g.page/r/.../review" oninput="PA.aj.linkAvaliacao=this.value.trim();atualizarSavebar()"><p class="hint">No Google Meu Negócio, toque em "Pedir avaliações" e copie o link. Depois de marcar "Compareceu", aparece o botão pra pedir a avaliação.</p></div></section>`;
  h += `<section class="panel"><h3>Sinal por Pix</h3><p>Ajuda a reduzir faltas. Depois de agendar, o cliente vê a chave Pix e manda o comprovante no WhatsApp.</p>
    <div class="field"><label for="ajSinal">Cobrar sinal de</label><select class="inp" id="ajSinal" onchange="PA.aj.sinalPara=this.value;render()">${[["ninguem","Ninguém"],["faltosos","Só de quem já faltou 2 vezes ou mais"],["todos","Todo mundo que agenda pela página"]].map(([v,l]) => `<option value="${v}" ${(a.sinalPara || "ninguem")===v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${(a.sinalPara || "ninguem")!=="ninguem" ? `<div class="two"><div class="field"><label for="ajSinalV">Valor do sinal (R$)</label><input class="inp tnum" id="ajSinalV" type="number" min="1" step="1" value="${a.sinalValor || ""}" oninput="PA.aj.sinalValor=+this.value;atualizarSavebar()"></div>
      <div class="field"><label for="ajPix">Chave Pix</label><input class="inp" id="ajPix" value="${esc(a.chavePix || "")}" placeholder="CPF, CNPJ, e-mail, celular ou chave aleatória" oninput="PA.aj.chavePix=this.value.trim();atualizarSavebar()"></div></div>
      <p class="hint">No painel, o horário fica com a etiqueta "Sinal pendente" até você tocar em "Sinal recebido".</p>` : ""}</section>`;
  h += blocoTelegram();
  h += `<section class="panel"><h3>Serviços</h3><p>O que o cliente pode escolher, com duração e preço. Desative em vez de apagar para manter o histórico.</p>
    ${a.servicos.map((s,i) => `<div class="svrow ${s.ativo ? "" : "off"}"><div class="field nm"><label for="sN${i}">Nome</label><input class="inp" id="sN${i}" value="${esc(s.nome)}" oninput="PA.aj.servicos[${i}].nome=this.value;atualizarSavebar()"></div>
      <div class="field"><label for="sD${i}">Minutos</label><input class="inp tnum" id="sD${i}" type="number" min="5" max="480" step="5" value="${s.duracao}" oninput="PA.aj.servicos[${i}].duracao=+this.value;atualizarSavebar()"></div>
      <div class="field"><label for="sP${i}">Preço (R$)</label><input class="inp tnum" id="sP${i}" type="number" min="0" step="1" value="${s.preco}" oninput="PA.aj.servicos[${i}].preco=+this.value;atualizarSavebar()"></div>
      <label class="switch" style="margin-bottom:10px"><input type="checkbox" ${s.ativo ? "checked" : ""} onchange="PA.aj.servicos[${i}].ativo=this.checked;render()" aria-label="Serviço ativo"><span></span></label>
      ${a.atendeOnline !== false ? `<label class="check" style="grid-column:1 / -1"><input type="checkbox" ${s.online ? "checked" : ""} onchange="PA.aj.servicos[${i}].online=this.checked;render()"><span>Por videochamada</span></label>` : ""}</div>`).join("")}
    <button class="btn btn-sec" type="button" onclick="PA.aj.servicos.push({id:'s'+Date.now().toString(36),nome:'Novo serviço',duracao:60,preco:0,ativo:true,online:false});render();setTimeout(()=>{const e=document.getElementById('sN'+(PA.aj.servicos.length-1));e&&(e.focus(),e.select())},20)">${ic("plus")} Adicionar serviço</button></section>`;
  h += blocoInstalar();
  const adm = PA.d.conta && PA.d.conta.admin, dona = adm ? PA.d.conta.negocios.find(n => n.p===PA.d.perfil.p) : null;
  if (adm) h += `<section class="panel"><h3>Acesso de ${esc(PC().nome)}</h3><p>Ela entra com ${esc(PA.d.perfil.login)}. ${dona && dona.senhaProvisoria ? "Ainda usa a senha provisória." : "Já trocou a senha provisória."}</p>
    <p class="hint">Se ela esquecer a senha ou travar o login, volte a senha para a provisória do código. Ela é desconectada dos aparelhos e troca de novo no próximo acesso.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${PA.confReset ? "btn-bad" : "btn-sec"}" style="white-space:normal;max-width:100%" type="button" onclick="resetarSenhaDona()">${ic("lock")} ${PA.confReset ? "Confirmar: voltar para a provisória" : "Voltar a senha dela para a provisória"}</button>${PA.confReset ? `<button class="btn btn-ghost" type="button" onclick="PA.confReset=false;render()">Cancelar</button>` : ""}</div></section>`;
  h += `<section class="panel"><h3>${adm ? "Sua conta de administrador" : "Conta e segurança"}</h3><p>Você entra com ${esc(PA.d.conta ? PA.d.conta.login : PA.d.perfil.login)}. Use pelo menos 8 caracteres. Ao trocar a senha, os outros aparelhos conectados saem do painel.</p>
    <div class="grid3"><div class="field"><label for="sjA">Senha atual</label><input class="inp" id="sjA" type="password" autocomplete="current-password" value="${esc(PA.sj.atual)}" oninput="PA.sj.atual=this.value"></div>
      <div class="field"><label for="sjN">Nova senha</label><input class="inp" id="sjN" type="password" autocomplete="new-password" value="${esc(PA.sj.nova)}" oninput="PA.sj.nova=this.value"></div>
      <div class="field"><label for="sjC">Repita a nova</label><input class="inp" id="sjC" type="password" autocomplete="new-password" value="${esc(PA.sj.conf)}" oninput="PA.sj.conf=this.value"></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" type="button" onclick="trocarSenha()">${ic("lock")} Trocar senha</button><button class="btn btn-ghost" type="button" onclick="sair()">${ic("out")} Sair do painel</button></div></section>`;
  h += `<div class="savebar" id="savebar" ${mudou ? "" : "hidden"}><span>Você tem alterações não salvas.</span><button class="btn btn-ghost btn-sm" type="button" onclick="PA.aj=clone(PA.d.config);render()">Descartar</button><button class="btn btn-pri btn-sm" type="button" onclick="salvarAjustes()">Salvar</button></div>`;
  return h;
}
function atualizarSavebar(){ const el = document.getElementById("savebar"); if (el) el.hidden = JSON.stringify(PA.aj) === JSON.stringify(PA.d.config); }
async function salvarAjustes(){
  const v = validarCfg(PA.aj); if (v){ toast(v); return; }
  const r = await acao("ajustes", {config:PA.aj}, "Ajustes salvos. A página de agendamento já foi atualizada.");
  if (r) { PA.aj = clone(PA.d.config); render(); }
}
async function trocarSenha(){
  const s = PA.sj;
  if (!s.atual || !s.nova){ toast("Preencha a senha atual e a nova."); return; }
  if (s.nova.length < 8){ toast("A nova senha precisa ter pelo menos 8 caracteres."); return; }
  if (s.nova === s.atual){ toast("A nova senha precisa ser diferente da atual."); return; }
  if (s.nova !== s.conf){ toast("A confirmação não bate com a nova senha."); return; }
  const r = await acao("senha", {atual:s.atual, nova:s.nova}, "Senha alterada. Outros aparelhos conectados foram desconectados.");
  if (r){ PA.sj = {atual:"", nova:"", conf:""}; render(); }
}
function desenharQR(){
  const el = document.getElementById("qr"); if (!el) return;
  if (typeof QRCode === "undefined"){ el.hidden = true; return; }
  el.innerHTML = ""; try{ new QRCode(el, {text:linkAgendar(), width:116, height:116, colorDark:"#15171C", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.hidden = true; }
}
/* login */
function telaLogin(){
  const L = PA.login;
  return `<div class="login"><aside class="side-art"><div class="brand"><span class="logo">${ic("logo")}</span>Hora Marcada</div>
      <div><h2>Sua agenda organizada sem troca de mensagens.</h2><ul>
        <li>${ic("check")}<span>Clientes marcam sozinhos e veem só os horários livres.</span></li>
        <li>${ic("check")}<span>Você aprova cada pedido e avisa no WhatsApp com um toque.</span></li>
        <li>${ic("check")}<span>A partir das ${HORA_VIRADA}h, o dia seguinte já aparece pronto.</span></li></ul></div>
      <div class="mock" aria-hidden="true"><div class="mrow"><b>09:00</b><span>Limpeza de pele</span><span class="chip c-ok">Confirmado</span></div><div class="mrow"><b>10:30</b><span>Design de sobrancelhas</span><span class="chip c-warn">Novo</span></div><div class="mrow"><b>14:00</b><span>Drenagem linfática</span><span class="chip c-info">Semanal</span></div></div></aside>
    <div class="lcard"><div class="brand"><span class="logo">${ic("logo")}</span>Hora Marcada</div><h1>Entrar no painel</h1><p>Veja seus agendamentos, aprove pedidos e organize seu dia.</p>
      <form class="lform" onsubmit="entrar(event)" novalidate>
        <div class="field"><label for="lEmail">E-mail</label><input class="inp" id="lEmail" type="email" autocomplete="username" value="${esc(L.email)}" oninput="PA.login.email=this.value" placeholder="voce@email.com"></div>
        <div class="field"><label for="lSenha">Senha</label><div class="pw"><input class="inp" id="lSenha" type="${L.ver ? "text" : "password"}" autocomplete="current-password" value="${esc(L.senha)}" oninput="PA.login.senha=this.value">
          <button type="button" aria-label="${L.ver ? "Esconder senha" : "Mostrar senha"}" onclick="PA.login.ver=!PA.login.ver;render();document.getElementById('lSenha').focus()">${ic(L.ver ? "eyeoff" : "eye")}</button></div></div>
        <div class="lrow"><label class="check"><input type="checkbox" ${L.manter ? "checked" : ""} onchange="PA.login.manter=this.checked"><span>Manter conectada neste aparelho</span></label>
          <button class="linkbtn" type="button" onclick="PA.login.esqueci=!PA.login.esqueci;render()">Esqueci a senha</button></div>
        ${L.esqueci ? `<p class="hint" style="background:var(--surface-2);padding:10px 12px;border-radius:10px">Peça uma senha nova para quem configurou seu sistema. Depois de entrar, você troca em Ajustes.</p>` : ""}
        ${L.erro ? `<p class="err" role="alert">${esc(L.erro)}</p>` : ""}
        <button class="btn btn-pri btn-lg" type="submit" ${L.enviando ? "disabled" : ""}>${L.enviando ? "Entrando…" : "Entrar"}</button></form>
      ${DEMO ? `<div class="demo-acc"><span class="hint">Contas de demonstração (senha ${DEMO_SENHA}):</span>
        <button type="button" onclick="demoEntrar('estetica')"><i style="background:${PADRAO.estetica.cor}">ML</i><div><b>Mônica Leitte Estúdio Prime</b><span>${PADRAO.estetica.login}</span></div></button>
        <button type="button" onclick="demoEntrar('psico')"><i style="background:${PADRAO.psico.cor}">IM</i><div><b>Isadora Monteverdi</b><span>${PADRAO.psico.login}</span></div></button>
        <button type="button" onclick="demoEntrar('_admin')"><i style="background:#15171C">JM</i><div><b>Administrador (você)</b><span>${DEMO_ADMIN}</span></div></button></div>` : ""}</div></div>`;
}

iniciar();
if (!DEMO && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
